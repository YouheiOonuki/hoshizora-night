# テストの自動実行（yorozu-craft の README「ツールを追加するとき」）。push と PR のたびに node --test を走らせる
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      # engine/ の写しが通常版（hoshizora-sanpo）の記録した版と 1 バイトも違わないか。main が進んでいればお知らせだけ出す
      - run: node tools/sync-from-sanpo.mjs --check
